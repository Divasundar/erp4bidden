<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProcureFlow ERP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><style>
:root{--navy:#102238;--blue:#2563eb;--teal:#0d9488;--ink:#172033;--muted:#64748b;--line:#e5eaf1;--bg:#f5f7fb;--card:#fff;--danger:#dc2626;--amber:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}h1,h2,h3{font-family:'Space Grotesk';margin:0 0 8px}.login{min-height:100vh;display:grid;place-items:center;background:#0f2138}.login-card{width:min(420px,92vw);background:#fff;padding:42px;border-radius:12px;box-shadow:0 20px 60px #07142688}.brand{font:700 22px 'Space Grotesk';color:var(--navy);display:flex;gap:10px;align-items:center}.mark{background:var(--blue);color:white;padding:9px 10px;border-radius:8px}.login h1{font-size:28px;margin-top:36px}.sub{color:var(--muted);margin:0 0 28px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:600;font-size:12px;color:#475569}.field input,.field select,.field textarea{border:1px solid #d8dee8;padding:11px 12px;border-radius:7px;font:inherit;background:#fff}.btn{border:0;border-radius:7px;padding:10px 15px;font:600 13px inherit;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eef3fb;color:#1d4ed8}.btn.ghost{background:transparent;color:var(--blue);border:1px solid #cbd8ef}.btn.danger{background:#fee2e2;color:#b91c1c}.full{width:100%;margin-top:10px}.demo{margin-top:24px;background:#f6f8fc;border-radius:8px;padding:12px;color:var(--muted);font-size:12px;line-height:1.8}.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#c4d0df;padding:22px 14px}.sidebar .brand{color:#fff;padding:0 10px 30px}.side-label{font-size:10px;color:#71839b;font-weight:700;letter-spacing:1.2px;padding:16px 12px 7px}.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#b9c7d8;padding:10px 12px;border-radius:6px;text-align:left;cursor:pointer;font:500 13px inherit}.nav:hover,.nav.active{background:#223a5b;color:#fff}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px}.search{flex:1;max-width:480px;border:1px solid var(--line);background:#f8fafc;border-radius:7px;padding:10px 13px}.user{margin-left:auto;display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:700}.content{padding:30px;max-width:1500px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:8px}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}.metric-label{color:var(--muted);font-size:12px}.metric{font:700 26px 'Space Grotesk';margin-top:12px}.metric-note{font-size:11px;color:var(--teal);margin-top:7px}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);padding:11px 10px;white-space:nowrap}.table td{border-bottom:1px solid #edf0f5;padding:13px 10px;white-space:nowrap}.badge{padding:5px 8px;border-radius:999px;background:#e8f0ff;color:#2455bd;font-size:11px;font-weight:700}.badge.green{background:#dcfce7;color:#15803d}.badge.orange{background:#ffedd5;color:#c2410c}.badge.red{background:#fee2e2;color:#b91c1c}.chart{height:250px}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#fff;width:min(680px,96vw);max-height:90vh;overflow:auto;border-radius:10px;padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.span{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#12243c;color:#fff;padding:13px 18px;border-radius:7px;z-index:9;box-shadow:0 6px 20px #0003}.insight{border-left:3px solid var(--teal);padding:10px 13px;background:#f0fdfa;margin:8px 0;border-radius:0 6px 6px 0}.risk{border-left:3px solid var(--danger);padding:10px;background:#fff5f5;margin:8px 0}.pill-row{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:70px 1fr}.sidebar{padding:16px 8px}.sidebar .brand span,.nav span,.side-label{display:none}.nav{justify-content:center}.metrics{grid-template-columns:repeat(2,1fr)}.content{padding:20px}.two,.three{grid-template-columns:1fr}}@media(max-width:560px){.metrics{grid-template-columns:1fr 1fr}.topbar{padding:0 15px}.content{padding:15px}.topbar .search{max-width:180px}.form-grid{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), root=$("#root");let me=null, data={};
async function api(url,opt={}){let r=await fetch('/api'+url,{credentials:'include',...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
async function init(){me=await api('/me');if(!me.id)return login();shell();dashboard()}
function login(){root.innerHTML=`<main class="login"><form class="login-card" id="login"><div class="brand"><b class="mark">PF</b><span>ProcureFlow</span></div><h1>Welcome back</h1><p class="sub">Intelligent procurement operations, in one place.</p><div class="field"><label>WORK EMAIL</label><input name="email" type="email" required placeholder="you@company.com"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" required></div><button class="btn full">Sign in to workspace</button><div class="demo"><b>Demo access</b><br>admin@procureflow.local / Admin@123<br>procurement@procureflow.local / Procure@123<br>manager@procureflow.local / Manager@123<br>vendor@procureflow.local / Vendor@123<br>warehouse@procureflow.local / Warehouse@123<br>finance@procureflow.local / Finance@123</div></form></main>`;$('#login').onsubmit=async e=>{e.preventDefault();try{me=await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});shell();dashboard()}catch(x){toast(x.message)}}}
const navs=[['dashboard','Dashboard','⌂','ALL'],['vendors','Vendors','◆','PROCUREMENT OFFICER,ADMIN'],['products','Products','▦','PROCUREMENT OFFICER,ADMIN'],['rfqs','RFQs','↗','PROCUREMENT OFFICER,ADMIN,MANAGER,VENDOR'],['quotes','Quotes & AI','✦','PROCUREMENT OFFICER,ADMIN,MANAGER,VENDOR'],['comparison','Comparison','≡','PROCUREMENT OFFICER,ADMIN,MANAGER'],['purchase_orders','Purchase Orders','▤','PROCUREMENT OFFICER,ADMIN,MANAGER,WAREHOUSE,FINANCE,VENDOR'],['inventory','Inventory','◫','WAREHOUSE,ADMIN,PROCUREMENT OFFICER'],['invoices','Invoices','▣','FINANCE,ADMIN,MANAGER'],['payments','Payments','◉','FINANCE,ADMIN'],['analytics','Analytics','◒','ADMIN,FINANCE,MANAGER'],['audit_logs','Audit Log','⌁','ADMIN'],['settings','Settings','⚙','ADMIN']];
function shell(){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><b class="mark">PF</b><span>ProcureFlow</span></div><div id="nav"></div></aside><section class="main"><header class="topbar"><input class="search" id="global-search" placeholder="Search vendors, RFQs, POs..."><span>🔔</span><div class="user"><div class="avatar">${me.name[0]}</div><div><b>${me.name}</b><small style="display:block;color:#64748b">${me.role}</small></div><button class="btn ghost" id="logout">Log out</button></div></header><main class="content" id="page"></main></section></div>`;$('#nav').innerHTML=navs.filter(n=>n[3]==='ALL'||n[3].split(',').includes(me.role)).map(n=>`<button class="nav" data-page="${n[0]}"><b>${n[2]}</b><span>${n[1]}</span></button>`).join('');document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>route(x.dataset.page));$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});login()};$('#global-search').oninput=async e=>{if(e.target.value.length>2){let r=await api('/search?q='+encodeURIComponent(e.target.value));toast(r.length+' results found')}}}
function route(p){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));({dashboard, vendors:()=>listPage('vendors','Vendors','company_name',['category','payment_terms','quality_score','delivery_score','status']),products:()=>listPage('products','Products','name',['sku','category','current_stock','reorder_level','average_price']),rfqs:()=>listPage('rfqs','Request for Quotation','title',['status','required_date','submission_deadline']),quotes:()=>listPage('quotes','Quotes & AI Analysis','vendor',['quote_number','total_cost','delivery_days','warranty_months','status']),purchase_orders:()=>listPage('purchase_orders','Purchase Orders','vendor',['status','total','created_at']),inventory:()=>listPage('inventory','Inventory','product',['sku','current_stock','reorder_level','warehouse']),invoices:()=>listPage('invoices','Invoices','invoice_number',['po_id','vendor','amount','due_date','status']),payments:()=>listPage('payments','Payments','payment_id',['invoice_id','amount','date','method','status']),comparison,analytics, audit_logs:()=>listPage('audit_logs','Audit Log','action',['user','entity','entity_id','timestamp']),settings} [p]||dashboard)()}
async function dashboard(){routeTitle('Dashboard','Good morning, '+me.name.split(' ')[0]+'. Here is your procurement command center.');let d=await api('/dashboard');$('#page').innerHTML=`<div class="page-head"><div><div class="eyebrow">OVERVIEW / ${new Date().toLocaleDateString()}</div><h1>Procurement command center</h1><p class="sub">Monitor spend, risk, and every decision in motion.</p></div><button class="btn" onclick="route('rfqs')">+ Create RFQ</button></div><div class="grid metrics">${[['Total spend','₹'+d.spend.toLocaleString(),'↗ 12.4% vs last month'],['Pending RFQs',d.pending_rfqs,'Needs attention'],['Active vendors',d.active_vendors,'Across 8 categories'],['Pending approvals',d.pending_approvals,'Manager review'],['Purchase orders',d.purchase_orders,'This financial year'],['Inventory value','₹'+d.inventory_value.toLocaleString(),'At current cost'],['Pending payments','₹'+d.pending_payments.toLocaleString(),'Finance queue'],['Estimated savings','₹'+Math.round(d.spend*.08).toLocaleString(),'AI identified']].map(x=>`<div class="card"><div class="metric-label">${x[0]}</div><div class="metric">${x[1]}</div><div class="metric-note">${x[2]}</div></div>`).join('')}</div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title"><h3>Monthly procurement spend</h3><span class="badge green">Live data</span></div><canvas class="chart" id="spendChart"></canvas></div><div class="card"><div class="section-title"><h3>AI procurement insights</h3><span>✦</span></div><div class="insight">${d.low_stock} products are below their reorder level.</div><div class="insight">Global Components has the strongest delivery performance.</div><div class="insight">AI has analyzed ${d.quotes_analyzed} quotation documents.</div><div class="insight">Estimated 8% savings available through vendor comparison.</div></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>Recent activity</h3><button class="btn ghost" onclick="route('audit_logs')">View audit log</button></div>${d.recent_activity.length?`<div class="table-wrap"><table class="table"><tbody>${d.recent_activity.map(x=>`<tr><td><b>${x.action}</b></td><td>${x.entity} ${x.entity_id}</td><td>${x.user}</td><td>${x.timestamp}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet.</div>'}</div>`;new Chart($('#spendChart'),{type:'line',data:{labels:['Mar','Apr','May','Jun','Jul','Aug'],datasets:[{label:'Spend',data:[52000,68000,61000,84000,79000,d.spend||92000],borderColor:'#2563eb',backgroundColor:'#dbeafe',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}
function routeTitle(t,s){$('#page').innerHTML=`<div class="page-head"><div><div class="eyebrow">WORKSPACE</div><h1>${t}</h1><p class="sub">${s||''}</p></div></div>`}
async function listPage(name,title,label,fields){routeTitle(title,'Operational records with live JSON persistence.');let rows=await api('/'+name);let can=['vendors','products','rfqs','invoices','payments'].includes(name)&&['ADMIN','PROCUREMENT OFFICER','FINANCE'].includes(me.role);$('#page').innerHTML+=`<div class="card"><div class="section-title"><h3>${rows.length} ${title.toLowerCase()}</h3><div>${can?`<button class="btn" onclick="openForm('${name}')">+ Add ${title.replace(/s$/,'')}</button>`:''} ${name==='quotes'?`<button class="btn secondary" onclick="openUpload()">✦ Analyze quotation</button>`:''}</div></div><div class="table-wrap"><table class="table"><thead><tr><th>${label}</th>${fields.map(f=>`<th>${f.replaceAll('_',' ')}</th>`).join('')}<th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[label]||r.id}</b><small style="display:block;color:#94a3b8">${r.id}</small></td>${fields.map(f=>`<td>${f==='status'?`<span class="badge ${String(r[f]).includes('APPROVED')||r[f]==='ACTIVE'||r[f]==='PAID'?'green':''}">${r[f]||'—'}</span>`:Array.isArray(r[f])?r[f].join(', '):(r[f]??'—')}</td>`).join('')}<td><button class="btn ghost" onclick="viewRecord('${name}','${r.id}')">View</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function viewRecord(n,id){let r=(await api('/'+n)).find(x=>x.id===id);alert(JSON.stringify(r,null,2))}
function openForm(name){let fields={vendors:['company_name','contact_person','email','phone','category','payment_terms','quality_score','delivery_score'],products:['name','sku','category','unit','description','current_stock','reorder_level','average_price'],rfqs:['title','description','required_date','delivery_location','submission_deadline']}[name];modal(`<h2>Add ${name.slice(0,-1)}</h2><form id="record-form">${fields.map(f=>`<div class="field"><label>${f.replaceAll('_',' ').toUpperCase()}</label><input name="${f}" ${f==='email'?'type="email"':''} ${f.includes('date')?'type="date"':''} ${f.includes('score')||f.includes('stock')||f.includes('price')?'type="number"':''} required></div>`).join('')}<button class="btn">Save record</button></form>`);$('#record-form').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));for(let k of Object.keys(b))if(['quality_score','delivery_score','current_stock','reorder_level','average_price'].includes(k))b[k]=Number(b[k]);if(name==='rfqs')Object.assign(b,{status:'DRAFT',items:[],selected_vendors:[]});try{await api('/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});closeModal();toast('Record saved');route(name)}catch(x){toast(x.message)}}}
function openUpload(){modal(`<h2>AI quotation analysis</h2><p class="sub">Upload a quote document and optionally correct the fields before saving.</p><form id="upload-form"><div class="field"><label>DOCUMENT</label><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.xlsx" required></div><div class="form-grid"><div class="field"><label>VENDOR</label><input name="vendor" placeholder="Detected from document"></div><div class="field"><label>QUOTE NUMBER</label><input name="quote_number"></div><div class="field"><label>PRODUCT</label><input name="product" value="Steel Bolt M10"></div><div class="field"><label>QUANTITY</label><input name="quantity" type="number" value="5000"></div><div class="field"><label>UNIT PRICE</label><input name="unit_price" type="number" step=".01" value="12.5"></div><div class="field"><label>TAX</label><input name="tax" type="number" step=".01" value="0"></div><div class="field"><label>SHIPPING</label><input name="shipping" type="number" step=".01" value="0"></div><div class="field"><label>DELIVERY DAYS</label><input name="delivery_days" type="number" value="10"></div><div class="field"><label>WARRANTY MONTHS</label><input name="warranty_months" type="number" value="24"></div><div class="field"><label>VALIDITY DAYS</label><input name="validity_days" type="number" value="30"></div></div><button class="btn">Extract and analyze</button></form>`);$('#upload-form').onsubmit=async e=>{e.preventDefault();try{let r=await api('/quotes/analyze',{method:'POST',body:new FormData(e.target)});closeModal();toast('AI analysis completed and saved');route('quotes')}catch(x){toast(x.message)}}}
async function comparison(){routeTitle('Vendor comparison','Deterministic scoring with explainable trade-offs.');let qs=await api('/quotes');$('#page').innerHTML+=`<div class="card"><div class="section-title"><h3>Select 2–5 quotations</h3><button class="btn" id="compare-btn">Run comparison</button></div><div class="pill-row">${qs.map(q=>`<label class="card" style="padding:12px;cursor:pointer"><input type="checkbox" value="${q.id}"> <b>${q.vendor}</b><small style="display:block;color:#64748b">₹${q.total_cost||0} · ${q.delivery_days} days</small></label>`).join('')}</div><div id="comparison-result" style="margin-top:20px"></div></div>`;$('#compare-btn').onclick=async()=>{let ids=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);try{let r=await api('/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quote_ids:ids})});$('#comparison-result').innerHTML=`<div class="insight"><b>🏆 Recommended: ${r.recommendation?.quote.vendor||'—'}</b> · Score ${r.recommendation?.score||0}/100</div><div class="table-wrap"><table class="table"><thead><tr><th>Vendor</th><th>Total cost</th><th>Price</th><th>Delivery</th><th>Quality</th><th>Warranty</th><th>Performance</th><th>Total</th></tr></thead><tbody>${r.results.map(x=>`<tr><td><b>${x.quote.vendor}</b></td><td>₹${x.quote.total_cost}</td>${Object.keys(x.breakdown).map(k=>`<td>${x.breakdown[k].toFixed(1)}</td>`).join('')}<td><span class="badge green">${x.score}</span></td></tr>`).join('')}</tbody></table></div>`}catch(x){toast(x.message)}}}
async function analytics(){routeTitle('Analytics','Spend, vendor performance, and AI intelligence.');let d=await api('/dashboard');$('#page').innerHTML+=`<div class="grid three"><div class="card"><h3>Spend by category</h3><canvas class="chart" id="cat"></canvas></div><div class="card"><h3>RFQ status</h3><canvas class="chart" id="rfq"></canvas></div><div class="card"><h3>AI intelligence</h3><div class="metric">${d.quotes_analyzed}</div><div class="metric-label">quotes analyzed</div><div class="insight">${d.low_stock} stock risks detected</div><div class="insight">~3.5 hrs manual review saved</div></div></div>`;new Chart($('#cat'),{type:'doughnut',data:{labels:['Hardware','Safety','Maintenance'],datasets:[{data:[52,28,20],backgroundColor:['#2563eb','#0d9488','#f59e0b']}]},options:{plugins:{legend:{position:'bottom'}}}});new Chart($('#rfq'),{type:'bar',data:{labels:['Open','Sent','Under review','Closed'],datasets:[{data:[d.pending_rfqs,2,1,4],backgroundColor:'#2563eb'}]},options:{plugins:{legend:{display:false}}}})}
async function settings(){routeTitle('Settings','Configure deterministic procurement intelligence.');let s=await api('/settings');s=Array.isArray(s)?{}:s;$('#page').innerHTML+=`<div class="card"><h3>Scoring weights</h3><p class="sub">Weights must total 100%. These values control vendor ranking.</p><form id="weights" class="form-grid">${['price','delivery','quality','warranty','performance'].map(k=>`<div class="field"><label>${k.toUpperCase()} %</label><input name="${k}" type="number" value="${s.weights?.[k]||{price:40,delivery:25,quality:15,warranty:10,performance:10}[k]}" min="0" max="100"></div>`).join('')}<button class="btn span">Save scoring model</button></form></div>`;$('#weights').onsubmit=async e=>{e.preventDefault();let weights=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));try{if(Object.values(weights).reduce((a,b)=>a+b,0)!==100)throw Error('Weights must total 100%');await api('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({weights})});toast('Scoring model saved')}catch(x){toast(x.message)}}}
function openChat(){modal(`<h2>Procurement assistant</h2><p class="sub">Ask about live vendors, spend, inventory, approvals, or invoices.</p><form id="chat-form"><div class="field"><label>QUESTION</label><input name="question" required placeholder="Which products are below reorder level?"></div><button class="btn">Ask</button></form><div id="chat-answer" style="margin-top:16px"></div>`);$('#chat-form').onsubmit=async e=>{e.preventDefault();let r=await api('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#chat-answer').innerHTML=`<div class="insight">${r.answer}</div><small>${r.source}</small>`}}
function modal(html){let x=document.createElement('div');x.className='modal-back';x.id='modal';x.innerHTML=`<div class="modal"><div class="modal-head"><span></span><button class="btn ghost" onclick="closeModal()">Close</button></div>${html}</div>`;document.body.append(x)}function closeModal(){$('#modal')?.remove()}
setInterval(()=>document.querySelectorAll('.chart').forEach(chart=>{chart.style.height='140px';chart.style.maxHeight='140px'}),500);init();
</script></body></html>
